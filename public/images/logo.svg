<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecd5a8"/>
      <stop offset="35%" stop-color="#d4b47a"/>
      <stop offset="70%" stop-color="#b69152"/>
      <stop offset="100%" stop-color="#9a7437"/>
    </linearGradient>
    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a5a2a"/>
      <stop offset="100%" stop-color="#463111"/>
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#logoShadow)">
    <!-- 3D Bevels (Right & Bottom Edges) -->
    <!-- Pillar 1 Bevel -->
    <polygon points="76,26 80,29 80,94 76,92" fill="url(#bevelGrad)"/>
    <polygon points="38,118 76,92 80,94 42,120" fill="url(#bevelGrad)"/>

    <!-- Pillar 2 Bevel -->
    <polygon points="126,26 130,29 130,94 126,92" fill="url(#bevelGrad)"/>
    <polygon points="88,118 126,92 130,94 92,120" fill="url(#bevelGrad)"/>

    <!-- Pillar 3 Bevel -->
    <polygon points="176,26 180,29 180,94 176,92" fill="url(#bevelGrad)"/>
    <polygon points="138,118 176,92 180,94 142,120" fill="url(#bevelGrad)"/>

    <!-- Front Faces (Gold Metallic) -->
    <!-- Pillar 1 (with top-left architectural eave) -->
    <polygon points="38,52 76,26 76,92 38,118 38,62 30,59 38,52" fill="url(#goldGrad)"/>

    <!-- Pillar 2 -->
    <polygon points="88,52 126,26 126,92 88,118" fill="url(#goldGrad)"/>

    <!-- Pillar 3 -->
    <polygon points="138,52 176,26 176,92 138,118" fill="url(#goldGrad)"/>

    <!-- Subtitle: THE BEST ONE -->
    <text x="105" y="145" 
          font-family="'Pretendard', 'Montserrat', 'Arial Black', Impact, sans-serif" 
          font-size="20" 
          font-weight="900" 
          letter-spacing="1.8" 
          fill="#e2e8f0" 
          text-anchor="middle">THE BEST ONE</text>
  </g>
</svg>